name: Documentation

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sphinx-build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - name: Check out Fab source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install documentation tools
        run: uv sync --extra docs

      - name: Build HTML documentation (Fab)
        working-directory: Documentation/fab
        run: uv run make clean html

      - name: Build HTML documentation (FabEngine)
        working-directory: Documentation/fabengine
        run: uv run make clean html

      - name: Install LaTeX packages for PDF generation
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            librsvg2-bin \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            latexmk

      - name: Generate PDF documentation (Fab)
        if: github.event_name != 'pull_request'
        working-directory: Documentation/fab
        run: |
          uv run make latexpdf
          cp -r build/latex build/html/

      - name: Prepare documentation site
        run: |
          mkdir -p Documentation/site/fab Documentation/site/fabengine
          cp -r Documentation/fab/build/html/. Documentation/site/fab/
          cp -r Documentation/fabengine/_build/html/. Documentation/site/fabengine/
          cp Documentation/index.html Documentation/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Documentation/site

  deploy-documentation:
    name: Deploy
    if: github.repository == 'MetOffice/fab' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write # Required to write and publish compiled HTML/PDF artifacts
      id-token: write # Required to securely mint the OpenID Connect (OIDC) token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: sphinx-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
