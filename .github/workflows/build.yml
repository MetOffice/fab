name: QA

on:
  push:
    branches:
      - main
      - v*.*
  pull_request:
    branches:
      - main
      - v*.*

jobs:
  checks:

    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13', '3.14']

    steps:
      # Should this step use a cache?
      #
      # No, this step does not need a cache. It is only installing system
      # packages (compilers and libraries) using apt, which is not affected
      # by GitHub Actions cache actions. Caching is more useful for
      # dependencies installed via pip or other package managers that support
      # caching.
      - name: Setup Compiler
        run: |
          sudo apt install -y llvm clang libclang-dev gcc gfortran

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The clang binding version has to match the version in the Ubuntu being used.
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install clang==18.1.8

      - name: Type check with mypy
        run: |
          pip install -e .[dev]
          pip install pytest
          python -m mypy source tests

      - name: Code style check with flake8
        run: |
          pip install -e .[dev]
          flake8 . --count --show-source --statistics

      - name: Unit tests with Pytest
        run: |
          pip install .[dev]
          python -m pytest --cov=fab tests/unit_tests

      - name: System tests with Pytest
        run: |
          pip install .[dev]
          python -m pytest --cov=fab tests/system_tests

      # Sphinx linkcheck can potentially detect false negatives due to network
      # issues or slow responses. To avoid failing the build due to these
      # issues, we set continue-on-error to true
      - name: Link Checks
        if: always()
        run: |
          pip install .[docs]
          cd Documentation
          make linkcheck
        continue-on-error: true
