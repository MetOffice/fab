name: QA

on:
  push:
    branches:
      - main
      - v*.*
  pull_request:
    branches:
      - main
      - v*.*

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      # Should this step use a cache?
      #
      # No, this step does not need a cache. It is only installing system
      # packages (compilers and libraries) using apt, which is not affected
      # by GitHub Actions cache actions. Caching is more useful for
      # dependencies installed via pip or other package managers that support
      # caching.
      - name: Setup Compiler
        run: |
          sudo apt install -y llvm clang libclang-dev gcc gfortran

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The clang binding version has to match the version in the Ubuntu being used.
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install clang==14.0
          pip install -e .[dev]
          pip install .[docs]

      - name: Type check with mypy
        run: python -m mypy source tests

      - name: Code style check with flake8
        if: always()
        run: flake8 . --count --show-source --statistics

      - name: Unit tests with Pytest
        if: always()
        run: python -m pytest --cov=fab tests/unit_tests

      - name: System tests with Pytest
        if: always()
        run: python -m pytest --cov=fab tests/system_tests

      # Sphinx linkcheck can potentially detect false negatives due to network
      # issues or slow responses. To avoid failing the build due to these
      # issues, we set continue-on-error to true
      - name: Link Checks
        if: always()
        working-directory: Documentation
        run: |
          sphinx-build -q -b linkcheck \
            -d _build/doctrees source _build/linkcheck || true
          echo "== Ignored links, if any =="
          jq -c 'select(.status == "ignored")' _build/linkcheck/output.json
        continue-on-error: true
